services:
  traefik:  
    image: traefik:3.0  
    command:  
      - "--api=true"  
      - "--api.insecure=false"  
      - "--providers.docker=true"  
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=1serventiaimoveisoeiras@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./letsencrypt:/letsencrypt  
      - /var/run/docker.sock:/var/run/docker.sock
  whoami:  
    image: traefik/whoami  
    labels:  
      - "traefik.http.routers.whoami.rule=Host(`whoami.1serventiaimoveisoeiras.com.br`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls.certresolver=myresolver"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indice_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - indice_net

  nginx:
    image: nginx:1.25-alpine
    container_name: indice_nginx
    restart: unless-stopped
    # Acesso direto de emergência (sem Traefik)
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - traefik
    networks:
      - indice_net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=indice_traefik"
      - "traefik.http.middlewares.indice-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.indice-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.indice-hsts.headers.stsPreload=true"
      - "traefik.http.middlewares.indice-hsts.headers.forceSTSHeader=true"
      - "traefik.http.routers.indice.rule=Host(`1serventiaimoveisoeiras.com.br`) || Host(`www.1serventiaimoveisoeiras.com.br`)"
      - "traefik.http.routers.indice.entrypoints=websecure"
      - "traefik.http.routers.indice.middlewares=indice-hsts"
      - "traefik.http.routers.indice.tls=true"
      - "traefik.http.routers.indice.tls.certresolver=letsencrypt"
      - "traefik.http.services.indice.loadbalancer.server.port=80"
      - "traefik.http.services.indice.loadbalancer.passhostheader=true"

  db:
    image: mysql:5.7
    container_name: indice_db
    restart: unless-stopped
    ports:
      - "${DB_PUBLISH_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cartoriobd}
      MYSQL_USER: ${DB_USERNAME:-cartorio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - indice_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - indice_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: indice_phpmyadmin
    restart: unless-stopped
    # Acesso direto de emergência (sem Traefik)
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      PMA_ABSOLUTE_URI: https://${TRAEFIK_PHPMYADMIN_HOST:-phpmyadmin.1serventiaimoveisoeiras.com.br}/
    depends_on:
      db:
        condition: service_healthy
      traefik:
        condition: service_started
    networks:
      - indice_net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=indice_traefik"
      - "traefik.http.routers.pma.rule=Host(`phpmyadmin.1serventiaimoveisoeiras.com.br`)"
      - "traefik.http.routers.pma.entrypoints=websecure"
      - "traefik.http.routers.pma.tls=true"
      - "traefik.http.routers.pma.tls.certresolver=letsencrypt"
      - "traefik.http.services.pma.loadbalancer.server.port=80"
      - "traefik.http.services.pma.loadbalancer.passhostheader=true"

volumes:
  indice_db_data:
  traefik_letsencrypt:

networks:
  indice_net:
    driver: bridge
  traefik:
    name: indice_traefik
    driver: bridge
