services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indice_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - indice_net

  nginx:
    image: nginx:1.25-alpine
    container_name: indice_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - indice_net

  db:
    image: mysql:5.7
    container_name: indice_db
    restart: unless-stopped
    ports:
      - "${DB_PUBLISH_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cartoriobd}
      MYSQL_USER: ${DB_USERNAME:-cartorio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - indice_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - indice_net

volumes:
  indice_db_data:

networks:
  indice_net:
    driver: bridge
