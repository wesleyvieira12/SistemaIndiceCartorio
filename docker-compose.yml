services:
  traefik:
    image: traefik:v2.11
    container_name: indice_traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    command:
      - --log.level=INFO
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=indice_traefik
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@1serventiaimoveisoeiras.com.br}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    networks:
      - traefik

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indice_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - indice_net

  nginx:
    image: nginx:1.25-alpine
    container_name: indice_nginx
    restart: unless-stopped
    # Acesso direto de emergência (sem Traefik)
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - traefik
    networks:
      - indice_net
      - traefik
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=indice_traefik"
      - "traefik.http.middlewares.indice-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.indice.rule=Host(`${TRAEFIK_HOST:-1serventiaimoveisoeiras.com.br}`)"
      - "traefik.http.routers.indice.entrypoints=web"
      - "traefik.http.routers.indice.middlewares=indice-https-redirect"
      - "traefik.http.routers.indice.service=indice"
      - "traefik.http.routers.indice-secure.rule=Host(`${TRAEFIK_HOST:-1serventiaimoveisoeiras.com.br}`)"
      - "traefik.http.routers.indice-secure.entrypoints=websecure"
      - "traefik.http.routers.indice-secure.tls=true"
      - "traefik.http.routers.indice-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.indice-secure.service=indice"
      - "traefik.http.services.indice.loadbalancer.server.port=80"

  db:
    image: mysql:5.7
    container_name: indice_db
    restart: unless-stopped
    ports:
      - "${DB_PUBLISH_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cartoriobd}
      MYSQL_USER: ${DB_USERNAME:-cartorio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - indice_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - indice_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: indice_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - indice_net

volumes:
  indice_db_data:
  traefik_letsencrypt:

networks:
  indice_net:
    driver: bridge
  traefik:
    name: indice_traefik
    driver: bridge
